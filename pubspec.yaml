name: coinscape
description: "CoinScape - 纪念币收藏管理应用 / Coin Collection Manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.6.1
  # 本地数据库
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3: ^3.3.1
  # 文件与路径
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.5.5
  # 权限请求（Android / iOS）
  permission_handler: ^12.0.1
  # 图片与文件操作
  image_picker: ^1.0.7
  file_picker: ^12.0.0-beta.2
  # 核心架构与云端同步
  uuid: ^4.3.3
  webdav_client: ^1.2.2
  # 导出功能
  pdf: ^3.12.0
  # crypto for sha256 in client file sync
  crypto: ^3.0.2
  printing: ^5.14.3
  share_plus: ^13.1.0
  archive: ^4.0.9
  # 工具
  intl: ^0.20.2
  http: ^1.6.0
  idb_shim: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 代码生成工具
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 提前配置中文字体，防止导出 PDF 时中文变成乱码方块
  # 请确保后续下载一个免费开源的思源黑体放入项目的 assets/fonts/ 目录下
  # fonts:
  #   - family: NotoSansSC
  #     fonts:
  #       - asset: assets/fonts/NotoSansSC-Regular.ttf
