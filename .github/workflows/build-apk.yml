name: Build APK and Draft Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        continue-on-error: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # ---------- 新增 1：恢复固定签名文件 ----------
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.jks

      - name: Doctor
        run: flutter doctor -v

      # ---------- 新增 2：构建时设置签名密码等环境变量 ----------
      - name: Build APKs (arm, arm64, x64)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-per-abi

      - name: List APK files
        run: ls -la build/app/outputs/apk/release/

      - name: Create Draft Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: draft-build-${{ github.sha }}
          name: "📦 草稿构建 - ${{ github.sha }}"
          draft: true
          prerelease: false
          files: |
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}